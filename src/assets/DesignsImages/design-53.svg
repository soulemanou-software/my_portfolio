<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g53a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="g53b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="50%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#d4a853"/>
    </linearGradient>
    <filter id="sh53"><feDropShadow dx="3" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#g53a)"/>
  <!-- Premium brand identity board mockup -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d4a853" letter-spacing="8">BRAND IDENTITY BOARD</text>
  <!-- Logo showcase - center -->
  <g transform="translate(400,180)" filter="url(#sh53)">
    <rect x="-130" y="-70" width="260" height="140" rx="12" fill="#292524"/>
    <circle cx="0" cy="-10" r="30" fill="none" stroke="url(#g53b)" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="url(#g53b)" font-weight="400">E</text>
    <text x="0" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#d4a853" letter-spacing="6">EMBER</text>
  </g>
  <!-- Color palette row -->
  <g transform="translate(80,300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#78716c" letter-spacing="3">PALETTE</text>
    <rect x="0" y="12" width="100" height="65" rx="8" fill="#0c0a09"/>
    <text x="50" y="58" text-anchor="middle" font-family="monospace" font-size="7" fill="#78716c">Rich Black</text>
    <rect x="115" y="12" width="100" height="65" rx="8" fill="#d4a853"/>
    <text x="165" y="58" text-anchor="middle" font-family="monospace" font-size="7" fill="#44403c">Antique Gold</text>
    <rect x="230" y="12" width="100" height="65" rx="8" fill="#f5f5f4"/>
    <text x="280" y="58" text-anchor="middle" font-family="monospace" font-size="7" fill="#78716c">Ivory</text>
    <rect x="345" y="12" width="100" height="65" rx="8" fill="#7c2d12"/>
    <text x="395" y="58" text-anchor="middle" font-family="monospace" font-size="7" fill="#fef3c7">Burnt Umber</text>
    <rect x="460" y="12" width="100" height="65" rx="8" fill="#44403c"/>
    <text x="510" y="58" text-anchor="middle" font-family="monospace" font-size="7" fill="#a8a29e">Charcoal</text>
    <rect x="575" y="12" width="65" height="65" rx="8" fill="#292524" stroke="#d4a853" stroke-width="0.5" opacity="0.5"/>
    <text x="607" y="58" text-anchor="middle" font-family="monospace" font-size="7" fill="#d4a853">Accent</text>
  </g>
  <!-- Typography showcase -->
  <g transform="translate(80,410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#78716c" letter-spacing="3">TYPOGRAPHY</text>
    <rect x="0" y="12" width="300" height="110" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1"/>
    <text x="20" y="48" font-family="Georgia, serif" font-size="28" fill="white" font-weight="700">Heading Aa</text>
    <text x="20" y="68" font-family="Arial, sans-serif" font-size="9" fill="#78716c">Georgia Bold — Display</text>
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="16" fill="#d6d3d1">Body Text Sample Aa</text>
    <text x="20" y="112" font-family="Arial, sans-serif" font-size="9" fill="#78716c">Inter Regular — Body</text>
  </g>
  <!-- Pattern/texture swatch -->
  <g transform="translate(420,410)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#78716c" letter-spacing="3">PATTERN</text>
    <rect x="0" y="12" width="300" height="110" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1"/>
    <!-- Diamond pattern -->
    <g fill="none" stroke="#d4a853" stroke-width="0.5" opacity="0.15">
      <polygon points="40,45 65,60 40,75 15,60"/><polygon points="65,45 90,60 65,75 40,60"/>
      <polygon points="90,45 115,60 90,75 65,60"/><polygon points="115,45 140,60 115,75 90,60"/>
      <polygon points="140,45 165,60 140,75 115,60"/><polygon points="165,45 190,60 165,75 140,60"/>
      <polygon points="190,45 215,60 190,75 165,60"/><polygon points="215,45 240,60 215,75 190,60"/>
      <polygon points="240,45 265,60 240,75 215,60"/>
      <polygon points="52,60 77,75 52,90 27,75"/><polygon points="77,60 102,75 77,90 52,75"/>
      <polygon points="102,60 127,75 102,90 77,75"/><polygon points="127,60 152,75 127,90 102,75"/>
      <polygon points="152,60 177,75 152,90 127,75"/><polygon points="177,60 202,75 177,90 152,75"/>
      <polygon points="202,60 227,75 202,90 177,75"/><polygon points="227,60 252,75 227,90 202,75"/>
    </g>
  </g>
  <!-- Business card mockup -->
  <g transform="translate(80,560)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#78716c" letter-spacing="3">BUSINESS CARD</text>
    <rect x="0" y="12" width="220" height="130" rx="8" fill="#0c0a09" stroke="#292524" stroke-width="1"/>
    <rect x="0" y="12" width="220" height="4" rx="2" fill="url(#g53b)" opacity="0.6"/>
    <circle cx="35" cy="65" r="14" fill="none" stroke="#d4a853" stroke-width="1"/>
    <text x="35" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#d4a853">E</text>
    <text x="65" y="60" font-family="Georgia, serif" font-size="10" fill="white" letter-spacing="2">EMBER</text>
    <text x="65" y="75" font-family="Arial, sans-serif" font-size="7" fill="#78716c" letter-spacing="1">Creative Director</text>
    <rect x="20" y="100" width="180" height="0.5" fill="#44403c" opacity="0.3"/>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="7" fill="#a8a29e">hello@ember.co</text>
    <text x="140" y="120" font-family="Arial, sans-serif" font-size="7" fill="#a8a29e">ember.co</text>
  </g>
  <!-- Mockup applications -->
  <g transform="translate(340,560)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#78716c" letter-spacing="3">APPLICATIONS</text>
    <!-- Tote bag -->
    <rect x="0" y="12" width="130" height="130" rx="8" fill="#292524" stroke="#3f3f46" stroke-width="0.5"/>
    <rect x="30" y="20" width="70" height="90" rx="6" fill="#1c1917"/>
    <circle cx="65" cy="55" r="12" fill="none" stroke="#d4a853" stroke-width="1" opacity="0.3"/>
    <text x="65" y="59" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#d4a853" opacity="0.4">E</text>
    <text x="65" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#78716c">Tote Bag</text>
    <!-- Cup -->
    <rect x="160" y="12" width="130" height="130" rx="8" fill="#292524" stroke="#3f3f46" stroke-width="0.5"/>
    <rect x="195" y="30" width="55" height="75" rx="6" fill="#1c1917"/>
    <circle cx="222" cy="60" r="10" fill="none" stroke="#d4a853" stroke-width="0.8" opacity="0.3"/>
    <text x="222" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#d4a853" opacity="0.4">E</text>
    <path d="M250,45 Q270,50 270,67 Q270,85 250,90" fill="none" stroke="#1c1917" stroke-width="2"/>
    <text x="225" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#78716c">Coffee Cup</text>
    <!-- Tag -->
    <rect x="320" y="12" width="130" height="130" rx="8" fill="#292524" stroke="#3f3f46" stroke-width="0.5"/>
    <rect x="355" y="30" width="55" height="80" rx="4" fill="#d4a853" opacity="0.15"/>
    <circle cx="382" cy="42" r="4" fill="#292524"/>
    <text x="382" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#d4a853" opacity="0.5">E</text>
    <text x="385" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#78716c">Hang Tag</text>
  </g>
  <!-- Bottom label -->
  <text x="400" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#78716c" letter-spacing="4">COMPLETE BRAND IDENTITY</text>
</svg>
