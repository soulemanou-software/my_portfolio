<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="grad32" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg32)"/>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="6">SOCIAL MEDIA KIT</text>
  <!-- Instagram Post mockup -->
  <g transform="translate(60,80)">
    <rect width="220" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="190" height="140" rx="6" fill="url(#grad32)" opacity="0.2"/>
    <text x="110" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="white" font-weight="600">Post</text>
    <text x="110" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">1080 x 1080</text>
    <rect x="15" y="170" width="80" height="6" rx="3" fill="#475569"/>
    <rect x="15" y="185" width="120" height="5" rx="2.5" fill="#334155"/>
    <rect x="15" y="198" width="60" height="5" rx="2.5" fill="#334155"/>
    <text x="110" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">IG POST</text>
  </g>
  <!-- Instagram Story mockup -->
  <g transform="translate(300,80)">
    <rect width="140" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="120" height="200" rx="6" fill="url(#grad32)" opacity="0.15"/>
    <text x="70" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" font-weight="600">Story</text>
    <text x="70" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">1080 x 1920</text>
    <rect x="20" y="220" width="100" height="5" rx="2.5" fill="#334155"/>
    <text x="70" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">IG STORY</text>
  </g>
  <!-- Facebook Cover mockup -->
  <g transform="translate(460,80)">
    <rect width="280" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="260" height="60" rx="4" fill="url(#grad32)" opacity="0.15"/>
    <text x="140" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white" font-weight="600">Cover Photo</text>
    <text x="140" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">820 x 312</text>
    <rect x="10" y="80" width="120" height="5" rx="2.5" fill="#334155"/>
    <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">FB COVER</text>
  </g>
  <!-- Twitter Header -->
  <g transform="translate(460,210)">
    <rect width="280" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="260" height="50" rx="4" fill="url(#grad32)" opacity="0.15"/>
    <text x="140" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="white" font-weight="600">Header</text>
    <text x="140" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">1500 x 500</text>
    <rect x="10" y="70" width="100" height="5" rx="2.5" fill="#334155"/>
    <text x="140" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">X HEADER</text>
  </g>
  <!-- LinkedIn Banner -->
  <g transform="translate(60,350)">
    <rect width="680" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="650" height="55" rx="6" fill="url(#grad32)" opacity="0.15"/>
    <text x="340" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="white" font-weight="600">LinkedIn Company Banner</text>
    <text x="340" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">1128 x 191</text>
    <rect x="15" y="85" width="200" height="5" rx="2.5" fill="#334155"/>
    <rect x="15" y="98" width="140" height="5" rx="2.5" fill="#334155"/>
    <text x="340" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">LINKEDIN BANNER</text>
  </g>
  <!-- Color palette strip -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="4">KIT COLOR PALETTE</text>
  <g transform="translate(130,540)">
    <rect width="90" height="50" rx="8" fill="#f472b6"/><text x="45" y="35" text-anchor="middle" font-size="8" fill="white" font-family="monospace">#F472B6</text>
    <rect x="110" width="90" height="50" rx="8" fill="#c084fc"/><text x="155" y="35" text-anchor="middle" font-size="8" fill="white" font-family="monospace">#C084FC</text>
    <rect x="220" width="90" height="50" rx="8" fill="#0f172a"/><text x="265" y="35" text-anchor="middle" font-size="8" fill="white" font-family="monospace">#0F172A</text>
    <rect x="330" width="90" height="50" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/><text x="375" y="35" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">#FFFFFF</text>
    <rect x="440" width="90" height="50" rx="8" fill="#64748b"/><text x="485" y="35" text-anchor="middle" font-size="8" fill="white" font-family="monospace">#64748B</text>
  </g>
  <!-- Typography -->
  <text x="400" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="4">KIT TYPOGRAPHY</text>
  <text x="200" y="685" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="white" font-weight="700">Heading Aa</text>
  <text x="200" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Georgia Bold</text>
  <text x="550" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1">Body Text Aa</text>
  <text x="550" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Inter Regular</text>
  <!-- Bottom label -->
  <rect x="250" y="740" width="300" height="35" rx="17" fill="url(#grad32)" opacity="0.15"/>
  <text x="400" y="763" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c084fc" letter-spacing="3">COMPLETE SOCIAL MEDIA KIT</text>
</svg>
