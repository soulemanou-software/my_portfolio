<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg28)"/>
  <!-- Ornate border -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#daa520" stroke-width="0.5" opacity="0.15"/>
  <rect x="55" y="55" width="690" height="690" fill="none" stroke="#daa520" stroke-width="0.3" opacity="0.1"/>
  <!-- Fashion hanger / abstract crown logo -->
  <g transform="translate(400,310)">
    <path d="M-80,-80 L0,-120 L80,-80" fill="none" stroke="url(#gold28)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-120" r="15" fill="none" stroke="url(#gold28)" stroke-width="2.5"/>
    <line x1="-80" y1="-80" x2="-80" y2="80" stroke="url(#gold28)" stroke-width="2.5"/>
    <line x1="80" y1="-80" x2="80" y2="80" stroke="url(#gold28)" stroke-width="2.5"/>
    <line x1="-80" y1="80" x2="80" y2="80" stroke="url(#gold28)" stroke-width="2.5"/>
    <!-- Cross stitch detail -->
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#daa520" stroke-width="0.5" opacity="0.3"/>
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#daa520" stroke-width="0.5" opacity="0.3"/>
    <line x1="-40" y1="30" x2="40" y2="30" stroke="#daa520" stroke-width="0.5" opacity="0.3"/>
    <!-- Diamond accent -->
    <polygon points="0,-50 15,-35 0,-20 -15,-35" fill="none" stroke="url(#gold28)" stroke-width="1.5"/>
    <polygon points="0,-45 8,-35 0,-25 -8,-35" fill="#daa520" opacity="0.3"/>
  </g>
  <!-- Brand -->
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#daa520" letter-spacing="12" font-weight="400">MAISON</text>
  <line x1="280" y1="510" x2="520" y2="510" stroke="#daa520" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#8b7355" letter-spacing="16">ÉLÉGANCE</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b5b3b" letter-spacing="4">PARIS • MILAN • NEW YORK</text>
</svg>
