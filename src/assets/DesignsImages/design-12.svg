<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="grad12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg12)"/>
  <!-- Abstract product shape - headphones silhouette -->
  <g transform="translate(400,320)" opacity="0.06">
    <path d="M-100,-80 Q-120,-120 -80,-140 Q-20,-160 0,-130 Q20,-160 80,-140 Q120,-120 100,-80" stroke="white" stroke-width="3" fill="none"/>
    <rect x="-120" y="-80" width="40" height="80" rx="12" fill="white"/>
    <rect x="80" y="-80" width="40" height="80" rx="12" fill="white"/>
  </g>
  <!-- Geometric accent circles -->
  <circle cx="600" cy="180" r="100" fill="none" stroke="#f97316" stroke-width="1" opacity="0.1"/>
  <circle cx="600" cy="180" r="70" fill="none" stroke="#ef4444" stroke-width="0.5" opacity="0.08"/>
  <!-- Badge -->
  <rect x="60" y="60" width="120" height="32" rx="16" fill="url(#grad12)"/>
  <text x="120" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" letter-spacing="2" font-weight="700">NEW DROP</text>
  <!-- Main content -->
  <text x="80" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" fill="white" font-weight="800">STUDIO</text>
  <text x="80" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" fill="url(#grad12)" font-weight="800">MAX PRO</text>
  <text x="80" y="330" font-family="Georgia, serif" font-size="18" fill="#94a3b8" letter-spacing="1">Premium wireless audio experience</text>
  <!-- Feature list -->
  <g transform="translate(80,390)">
    <circle cx="0" cy="0" r="4" fill="#f97316"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Active Noise Cancellation</text>
    <circle cx="0" cy="35" r="4" fill="#ef4444"/>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">48-Hour Battery Life</text>
    <circle cx="0" cy="70" r="4" fill="#f97316"/>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Spatial Audio Technology</text>
  </g>
  <!-- Price -->
  <text x="80" y="560" font-family="'Helvetica Neue', sans-serif" font-size="42" fill="white" font-weight="700">$349</text>
  <text x="215" y="560" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-decoration="line-through">$449</text>
  <!-- CTA -->
  <rect x="80" y="600" width="200" height="50" rx="25" fill="url(#grad12)"/>
  <text x="180" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" letter-spacing="2" font-weight="600">SHOP NOW</text>
  <!-- Bottom accent -->
  <rect x="0" y="760" width="800" height="40" fill="url(#grad12)" opacity="0.08"/>
  <text x="400" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="4">FREE SHIPPING WORLDWIDE</text>
</svg>
