<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g41a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="g41b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="g41c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur41"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#g41a)"/>
  <!-- Ambient light blobs -->
  <circle cx="300" cy="300" r="200" fill="#fbbf24" opacity="0.03" filter="url(#blur41)"/>
  <circle cx="520" cy="400" r="180" fill="#d97706" opacity="0.025" filter="url(#blur41)"/>
  <!-- Intricate mandala-style logo -->
  <g transform="translate(400,330)">
    <!-- Outer ring with segments -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="url(#g41b)" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#g41b)" stroke-width="0.5" opacity="0.15"/>
    <!-- Radiating lines -->
    <g stroke="#fbbf24" stroke-width="0.5" opacity="0.12">
      <line x1="0" y1="-155" x2="0" y2="-130"/><line x1="0" y1="130" x2="0" y2="155"/>
      <line x1="-155" y1="0" x2="-130" y2="0"/><line x1="130" y1="0" x2="155" y2="0"/>
      <line x1="-110" y1="-110" x2="-92" y2="-92"/><line x1="92" y1="-92" x2="110" y2="-110"/>
      <line x1="-110" y1="110" x2="-92" y2="92"/><line x1="92" y1="92" x2="110" y2="110"/>
      <line x1="-55" y1="-145" x2="-46" y2="-122"/><line x1="55" y1="-145" x2="46" y2="-122"/>
      <line x1="-55" y1="145" x2="-46" y2="122"/><line x1="55" y1="145" x2="46" y2="122"/>
      <line x1="-145" y1="-55" x2="-122" y2="-46"/><line x1="145" y1="-55" x2="122" y2="-46"/>
      <line x1="-145" y1="55" x2="-122" y2="46"/><line x1="145" y1="55" x2="122" y2="46"/>
    </g>
    <!-- Inner diamond -->
    <polygon points="0,-110 110,0 0,110 -110,0" fill="none" stroke="url(#g41b)" stroke-width="1.5" opacity="0.35"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#g41b)" stroke-width="1.5" opacity="0.4"/>
    <!-- Petal shapes -->
    <g fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2">
      <path d="M0,-80 Q30,-40 0,0 Q-30,-40 0,-80"/>
      <path d="M80,0 Q40,30 0,0 Q40,-30 80,0"/>
      <path d="M0,80 Q-30,40 0,0 Q30,40 0,80"/>
      <path d="M-80,0 Q-40,-30 0,0 Q-40,30 -80,0"/>
    </g>
    <!-- Diagonal petals -->
    <g fill="none" stroke="#d97706" stroke-width="0.8" opacity="0.15">
      <path d="M-57,-57 Q-15,-35 0,0 Q-35,-15 -57,-57"/>
      <path d="M57,-57 Q35,-15 0,0 Q15,-35 57,-57"/>
      <path d="M57,57 Q15,35 0,0 Q35,15 57,57"/>
      <path d="M-57,57 Q-35,15 0,0 Q-15,35 -57,57"/>
    </g>
    <!-- Center lotus -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#g41b)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#fbbf24" opacity="0.5"/>
    <!-- Small inner petals -->
    <g fill="#fbbf24" opacity="0.08">
      <ellipse cx="0" cy="-26" rx="6" ry="12"/><ellipse cx="0" cy="26" rx="6" ry="12"/>
      <ellipse cx="-26" cy="0" rx="12" ry="6"/><ellipse cx="26" cy="0" rx="12" ry="6"/>
      <ellipse cx="-18" cy="-18" rx="5" ry="10" transform="rotate(-45,-18,-18)"/>
      <ellipse cx="18" cy="-18" rx="5" ry="10" transform="rotate(45,18,-18)"/>
      <ellipse cx="-18" cy="18" rx="5" ry="10" transform="rotate(45,-18,18)"/>
      <ellipse cx="18" cy="18" rx="5" ry="10" transform="rotate(-45,18,18)"/>
    </g>
  </g>
  <!-- Brand -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="url(#g41b)" letter-spacing="14" font-weight="400">SAHARA</text>
  <rect x="300" y="560" width="200" height="0.5" fill="#fbbf24" opacity="0.2"/>
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e" letter-spacing="8">LUXURY SPA &amp; WELLNESS</text>
  <!-- Floating gold particles -->
  <circle cx="140" cy="120" r="1.5" fill="#fbbf24" opacity="0.3"/>
  <circle cx="660" cy="180" r="2" fill="#d97706" opacity="0.25"/>
  <circle cx="100" cy="550" r="1" fill="#fbbf24" opacity="0.2"/>
  <circle cx="700" cy="600" r="1.5" fill="#f59e0b" opacity="0.2"/>
  <circle cx="200" cy="700" r="1" fill="#fbbf24" opacity="0.15"/>
  <circle cx="600" cy="700" r="2" fill="#d97706" opacity="0.15"/>
</svg>
