<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg33" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg33)"/>
  <!-- Brand Color Palette Showcase -->
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a3a3a3" letter-spacing="6">BRAND COLOR SYSTEM</text>
  <!-- Primary colors -->
  <text x="80" y="100" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1a1a1a" font-weight="700" letter-spacing="2">PRIMARY</text>
  <g transform="translate(80,115)">
    <rect width="200" height="120" rx="12" fill="#0f172a"/>
    <text x="15" y="90" font-family="'Courier New', monospace" font-size="11" fill="white">#0F172A</text>
    <text x="15" y="108" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Midnight Navy</text>
  </g>
  <g transform="translate(300,115)">
    <rect width="200" height="120" rx="12" fill="#1e3a5f"/>
    <text x="15" y="90" font-family="'Courier New', monospace" font-size="11" fill="white">#1E3A5F</text>
    <text x="15" y="108" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd">Deep Ocean</text>
  </g>
  <g transform="translate(520,115)">
    <rect width="200" height="120" rx="12" fill="#3b82f6"/>
    <text x="15" y="90" font-family="'Courier New', monospace" font-size="11" fill="white">#3B82F6</text>
    <text x="15" y="108" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Royal Blue</text>
  </g>
  <!-- Accent colors -->
  <text x="80" y="275" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1a1a1a" font-weight="700" letter-spacing="2">ACCENT</text>
  <g transform="translate(80,290)">
    <rect width="145" height="100" rx="12" fill="#f59e0b"/>
    <text x="12" y="72" font-family="'Courier New', monospace" font-size="10" fill="white">#F59E0B</text>
    <text x="12" y="88" font-family="Arial, sans-serif" font-size="8" fill="#fef3c7">Amber</text>
  </g>
  <g transform="translate(240,290)">
    <rect width="145" height="100" rx="12" fill="#10b981"/>
    <text x="12" y="72" font-family="'Courier New', monospace" font-size="10" fill="white">#10B981</text>
    <text x="12" y="88" font-family="Arial, sans-serif" font-size="8" fill="#d1fae5">Emerald</text>
  </g>
  <g transform="translate(400,290)">
    <rect width="145" height="100" rx="12" fill="#ef4444"/>
    <text x="12" y="72" font-family="'Courier New', monospace" font-size="10" fill="white">#EF4444</text>
    <text x="12" y="88" font-family="Arial, sans-serif" font-size="8" fill="#fecaca">Crimson</text>
  </g>
  <g transform="translate(560,290)">
    <rect width="160" height="100" rx="12" fill="#8b5cf6"/>
    <text x="12" y="72" font-family="'Courier New', monospace" font-size="10" fill="white">#8B5CF6</text>
    <text x="12" y="88" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">Violet</text>
  </g>
  <!-- Neutral scale -->
  <text x="80" y="430" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1a1a1a" font-weight="700" letter-spacing="2">NEUTRALS</text>
  <g transform="translate(80,445)">
    <rect width="80" height="60" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <text x="40" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#525252">50</text>
  </g>
  <g transform="translate(170,445)">
    <rect width="80" height="60" rx="8" fill="#e5e5e5"/>
    <text x="40" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#525252">200</text>
  </g>
  <g transform="translate(260,445)">
    <rect width="80" height="60" rx="8" fill="#a3a3a3"/>
    <text x="40" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="white">400</text>
  </g>
  <g transform="translate(350,445)">
    <rect width="80" height="60" rx="8" fill="#737373"/>
    <text x="40" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="white">500</text>
  </g>
  <g transform="translate(440,445)">
    <rect width="80" height="60" rx="8" fill="#525252"/>
    <text x="40" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="white">600</text>
  </g>
  <g transform="translate(530,445)">
    <rect width="80" height="60" rx="8" fill="#262626"/>
    <text x="40" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="white">800</text>
  </g>
  <g transform="translate(620,445)">
    <rect width="100" height="60" rx="8" fill="#0a0a0a"/>
    <text x="50" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="white">950</text>
  </g>
  <!-- Gradient combinations -->
  <text x="80" y="555" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1a1a1a" font-weight="700" letter-spacing="2">GRADIENTS</text>
  <g transform="translate(80,570)">
    <defs>
      <linearGradient id="gr1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="gr2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
      <linearGradient id="gr3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    </defs>
    <rect width="200" height="70" rx="12" fill="url(#gr1)"/>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="600">Ocean Gradient</text>
    <text x="100" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.7">Blue to Violet</text>
  </g>
  <g transform="translate(300,570)">
    <rect width="200" height="70" rx="12" fill="url(#gr2)"/>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="600">Sunset Gradient</text>
    <text x="100" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.7">Amber to Crimson</text>
  </g>
  <g transform="translate(520,570)">
    <rect width="200" height="70" rx="12" fill="url(#gr3)"/>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="600">Nature Gradient</text>
    <text x="100" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.7">Emerald to Blue</text>
  </g>
  <!-- Usage note -->
  <rect x="80" y="675" width="640" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155" font-weight="600">Usage Guidelines</text>
  <text x="400" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Maintain WCAG AA contrast ratios. Primary on backgrounds. Accents for CTAs and highlights only.</text>
  <!-- Label -->
  <text x="400" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a3a3a3" letter-spacing="4">COLOR PALETTE DESIGN</text>
</svg>
