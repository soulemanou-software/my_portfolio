<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g42a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="50%" stop-color="#120628"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="g42b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="g42c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neon42">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#g42a)"/>
  <!-- Star field -->
  <g fill="white">
    <circle cx="80" cy="60" r="0.8" opacity="0.4"/><circle cx="200" cy="120" r="0.5" opacity="0.3"/>
    <circle cx="350" cy="80" r="0.7" opacity="0.35"/><circle cx="520" cy="100" r="0.6" opacity="0.25"/>
    <circle cx="680" cy="70" r="0.9" opacity="0.4"/><circle cx="720" cy="200" r="0.5" opacity="0.3"/>
    <circle cx="60" cy="300" r="0.6" opacity="0.25"/><circle cx="740" cy="350" r="0.7" opacity="0.35"/>
    <circle cx="100" cy="500" r="0.5" opacity="0.2"/><circle cx="700" cy="550" r="0.8" opacity="0.3"/>
    <circle cx="150" cy="680" r="0.6" opacity="0.25"/><circle cx="650" cy="700" r="0.7" opacity="0.3"/>
  </g>
  <!-- Neon infinity symbol / abstract wing -->
  <g transform="translate(400,320)" filter="url(#neon42)">
    <!-- Left wing -->
    <path d="M-20,0 Q-80,-90 -140,-50 Q-180,-20 -140,20 Q-80,70 -20,0" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.8"/>
    <path d="M-20,0 Q-80,-90 -140,-50 Q-180,-20 -140,20 Q-80,70 -20,0" fill="#06b6d4" opacity="0.03"/>
    <path d="M-20,0 Q-70,-70 -120,-40 Q-150,-15 -120,15 Q-70,50 -20,0" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <!-- Right wing -->
    <path d="M20,0 Q80,-90 140,-50 Q180,-20 140,20 Q80,70 20,0" fill="none" stroke="#ec4899" stroke-width="2.5" opacity="0.8"/>
    <path d="M20,0 Q80,-90 140,-50 Q180,-20 140,20 Q80,70 20,0" fill="#ec4899" opacity="0.03"/>
    <path d="M20,0 Q70,-70 120,-40 Q150,-15 120,15 Q70,50 20,0" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
    <!-- Center overlap -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#g42b)" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="url(#g42b)" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.8"/>
    <!-- Connecting arc -->
    <path d="M-20,0 Q0,-30 20,0 Q0,30 -20,0" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <!-- Orbiting particles -->
    <circle cx="-100" cy="-60" r="3" fill="#06b6d4" opacity="0.6"/>
    <circle cx="100" cy="-60" r="3" fill="#ec4899" opacity="0.6"/>
    <circle cx="-130" cy="10" r="2" fill="#06b6d4" opacity="0.4"/>
    <circle cx="130" cy="10" r="2" fill="#ec4899" opacity="0.4"/>
    <!-- Trail lines -->
    <path d="M-100,-60 Q-60,-80 -20,-10" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
    <path d="M100,-60 Q60,-80 20,-10" fill="none" stroke="#ec4899" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Light beams -->
  <polygon points="400,320 370,800 430,800" fill="url(#g42c)" opacity="0.015"/>
  <!-- Brand -->
  <text x="400" y="505" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" fill="white" font-weight="200" letter-spacing="10">ETHEREAL</text>
  <text x="400" y="505" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" fill="url(#g42b)" font-weight="200" letter-spacing="10" opacity="0.5">ETHEREAL</text>
  <rect x="280" y="520" width="240" height="1.5" fill="url(#g42b)" opacity="0.3"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b5cf6" letter-spacing="8">MOTION DESIGN</text>
  <!-- Decorative scan line -->
  <rect x="0" y="650" width="800" height="0.5" fill="url(#g42b)" opacity="0.06"/>
  <rect x="0" y="680" width="800" height="0.5" fill="url(#g42b)" opacity="0.04"/>
</svg>
