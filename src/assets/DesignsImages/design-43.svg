    <path d="M0,120 Q10,145 25,155" fill="none" stroke="#059669" stroke-width="0.8" opacity="0.12"/>
    <path d="M0,120 Q-5,150 -10,165" fill="none" stroke="#059669" stroke-width="0.6" opacity="0.1"/>
