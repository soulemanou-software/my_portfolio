    <path d="M0,10 Q-55,-20 -85,15" fill="none" stroke="#059669" stroke-width="1" opacity="0.3"/>
    <path d="M0,60 Q-45,35 -70,65 Q-40,55 0,60" fill="#10b981" opacity="0.07"/>
    <path d="M0,60 Q-45,35 -70,65" fill="none" stroke="#10b981" stroke-width="1" opacity="0.25"/>
