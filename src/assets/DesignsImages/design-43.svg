    <path d="M0,-55 Q55,-85 90,-50" fill="none" stroke="#059669" stroke-width="1.2" opacity="0.35"/>
    <path d="M0,-10 Q50,-40 80,-5 Q45,-5 0,-10" fill="#10b981" opacity="0.08"/>
    <path d="M0,-10 Q50,-40 80,-5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <path d="M0,40 Q40,15 65,45 Q35,40 0,40" fill="#059669" opacity="0.07"/>
    <path d="M0,40 Q40,15 65,45" fill="none" stroke="#059669" stroke-width="1" opacity="0.25"/>
