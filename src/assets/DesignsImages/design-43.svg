  <!-- Circular frame -->
  <circle cx="400" cy="310" r="185" fill="none" stroke="#059669" stroke-width="1" opacity="0.12"/>
  <circle cx="400" cy="310" r="190" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.08" stroke-dasharray="2 4"/>
  <!-- Brand -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="#065f46" letter-spacing="8" font-weight="400">BLOOM</text>
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="url(#g43c)" letter-spacing="8" font-weight="400" opacity="0.4">BLOOM</text>
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#10b981" letter-spacing="10" font-style="italic">botanicals</text>
