      <ellipse cx="-12" cy="-5" rx="8" ry="16" fill="#f0abfc" opacity="0.25" transform="rotate(-35,-12,-5)"/>
      <ellipse cx="8" cy="10" rx="7" ry="14" fill="#f0abfc" opacity="0.2" transform="rotate(70,8,10)"/>
      <ellipse cx="-8" cy="10" rx="7" ry="14" fill="#f0abfc" opacity="0.2" transform="rotate(-70,-8,10)"/>
      <circle cx="0" cy="0" r="5" fill="#fbbf24" opacity="0.4"/>
    </g>
    <!-- Small buds -->
