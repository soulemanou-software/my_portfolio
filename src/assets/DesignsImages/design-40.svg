<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g40a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <linearGradient id="g40b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="clip40"><circle cx="400" cy="310" r="150"/></clipPath>
  </defs>
  <rect width="800" height="800" fill="url(#g40a)"/>
  <!-- Subtle paper texture -->
  <g opacity="0.015">
    <rect x="0" y="0" width="2" height="800" fill="#000"/><rect x="8" y="0" width="1" height="800" fill="#000"/>
    <rect x="18" y="0" width="2" height="800" fill="#000"/><rect x="30" y="0" width="1" height="800" fill="#000"/>
    <rect x="42" y="0" width="2" height="800" fill="#000"/><rect x="55" y="0" width="1" height="800" fill="#000"/>
  </g>
  <!-- Circular frame with abstract art inside -->
  <circle cx="400" cy="310" r="152" fill="none" stroke="#b45309" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="310" r="150" fill="#faf7f2"/>
  <g clip-path="url(#clip40)">
    <!-- Abstract brush strokes inside circle -->
    <path d="M260,220 Q320,180 380,230 Q440,280 500,220 Q540,180 560,250" fill="none" stroke="#b45309" stroke-width="28" stroke-linecap="round" opacity="0.15"/>
    <path d="M240,300 Q320,260 400,310 Q480,360 540,300" fill="none" stroke="#d97706" stroke-width="22" stroke-linecap="round" opacity="0.12"/>
    <path d="M280,380 Q350,340 420,390 Q480,430 550,370" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round" opacity="0.1"/>
    <!-- Ink splatter dots -->
    <circle cx="320" cy="250" r="18" fill="#b45309" opacity="0.08"/>
    <circle cx="450" cy="350" r="25" fill="#d97706" opacity="0.06"/>
    <circle cx="380" cy="280" r="12" fill="#f59e0b" opacity="0.1"/>
    <circle cx="480" cy="250" r="8" fill="#b45309" opacity="0.12"/>
    <circle cx="340" cy="370" r="15" fill="#d97706" opacity="0.07"/>
    <!-- Calligraphic K -->
    <text x="400" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="160" fill="url(#g40b)" font-weight="400" opacity="0.85">K</text>
  </g>
  <!-- Outer decorative ring -->
  <circle cx="400" cy="310" r="170" fill="none" stroke="#b45309" stroke-width="0.5" opacity="0.15" stroke-dasharray="4 6"/>
  <!-- Small accent dots on ring -->
  <circle cx="400" cy="140" r="3" fill="#b45309" opacity="0.3"/>
  <circle cx="400" cy="480" r="3" fill="#b45309" opacity="0.3"/>
  <circle cx="230" cy="310" r="3" fill="#b45309" opacity="0.3"/>
  <circle cx="570" cy="310" r="3" fill="#b45309" opacity="0.3"/>
  <!-- Brand name -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#44403c" letter-spacing="12" font-weight="400">KAIROSART</text>
  <rect x="300" y="562" width="200" height="1" fill="#b45309" opacity="0.25"/>
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a8a29e" letter-spacing="6">FINE ART GALLERY</text>
  <!-- Decorative flourish -->
  <path d="M340,610 Q370,625 400,615 Q430,605 460,620" fill="none" stroke="#d97706" stroke-width="1" opacity="0.2"/>
  <circle cx="400" cy="615" r="2" fill="#d97706" opacity="0.3"/>
</svg>
