<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg22)"/>
  <!-- Brand Guidelines Page mockup -->
  <!-- Page -->
  <rect x="80" y="40" width="640" height="720" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Header -->
  <rect x="80" y="40" width="640" height="60" rx="8" fill="#0f172a"/>
  <text x="120" y="78" font-family="Arial, sans-serif" font-size="12" fill="white" letter-spacing="4" font-weight="600">BRAND GUIDELINES</text>
  <text x="680" y="78" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#64748b">PAGE 04</text>
  <!-- Section: Color Palette -->
  <text x="120" y="140" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#0f172a" font-weight="700">Color Palette</text>
  <rect x="120" y="152" width="40" height="2" fill="#3b82f6"/>
  <!-- Color swatches -->
  <g transform="translate(120,175)">
    <rect width="120" height="80" rx="8" fill="#0f172a"/>
    <text x="10" y="60" font-family="'Courier New', monospace" font-size="9" fill="white">#0F172A</text>
    <text x="10" y="73" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Primary</text>
  </g>
  <g transform="translate(260,175)">
    <rect width="120" height="80" rx="8" fill="#3b82f6"/>
    <text x="10" y="60" font-family="'Courier New', monospace" font-size="9" fill="white">#3B82F6</text>
    <text x="10" y="73" font-family="Arial, sans-serif" font-size="8" fill="#bfdbfe">Accent</text>
  </g>
  <g transform="translate(400,175)">
    <rect width="120" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="10" y="60" font-family="'Courier New', monospace" font-size="9" fill="#334155">#F8FAFC</text>
    <text x="10" y="73" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Background</text>
  </g>
  <g transform="translate(540,175)">
    <rect width="120" height="80" rx="8" fill="#10b981"/>
    <text x="10" y="60" font-family="'Courier New', monospace" font-size="9" fill="white">#10B981</text>
    <text x="10" y="73" font-family="Arial, sans-serif" font-size="8" fill="#a7f3d0">Success</text>
  </g>
  <!-- Section: Typography -->
  <text x="120" y="310" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#0f172a" font-weight="700">Typography</text>
  <rect x="120" y="322" width="40" height="2" fill="#3b82f6"/>
  <!-- Type samples -->
  <text x="120" y="365" font-family="Georgia, serif" font-size="28" fill="#0f172a" font-weight="700">Heading Style</text>
  <text x="120" y="385" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">Georgia Bold — 28px / 1.2 line height</text>
  <text x="120" y="425" font-family="Arial, sans-serif" font-size="16" fill="#334155">Body text sample style</text>
  <text x="120" y="445" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">Inter Regular — 16px / 1.6 line height</text>
  <text x="120" y="480" font-family="Arial, sans-serif" font-size="11" fill="#64748b" letter-spacing="3">CAPTION STYLE TEXT</text>
  <text x="120" y="498" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">Inter Medium — 11px / Tracking 3px</text>
  <!-- Section: Logo Usage -->
  <text x="120" y="550" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#0f172a" font-weight="700">Logo Usage</text>
  <rect x="120" y="562" width="40" height="2" fill="#3b82f6"/>
  <!-- Logo placement boxes -->
  <rect x="120" y="580" width="160" height="100" rx="8" fill="#0f172a"/>
  <circle cx="200" cy="620" r="18" fill="none" stroke="white" stroke-width="1.5"/>
  <text x="200" y="627" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white">V</text>
  <text x="200" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">Dark Background</text>
  <rect x="310" y="580" width="160" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="390" cy="620" r="18" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="390" y="627" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#0f172a">V</text>
  <text x="390" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">Light Background</text>
  <rect x="500" y="580" width="160" height="100" rx="8" fill="#3b82f6"/>
  <circle cx="580" cy="620" r="18" fill="none" stroke="white" stroke-width="1.5"/>
  <text x="580" y="627" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white">V</text>
  <text x="580" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#bfdbfe">Brand Color BG</text>
  <!-- Footer -->
  <text x="400" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e1" letter-spacing="2">VERTEX STUDIO — BRAND GUIDELINES V2.0</text>
</svg>
