<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="grad18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg18)"/>
  <!-- Story timeline dots -->
  <g transform="translate(80,0)">
    <line x1="0" y1="120" x2="0" y2="680" stroke="#3b82f6" stroke-width="2" opacity="0.15"/>
    <circle cx="0" cy="160" r="8" fill="url(#grad18)"/>
    <circle cx="0" cy="300" r="8" fill="url(#grad18)"/>
    <circle cx="0" cy="440" r="8" fill="url(#grad18)"/>
    <circle cx="0" cy="580" r="8" fill="url(#grad18)" opacity="0.5"/>
  </g>
  <!-- Header -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" letter-spacing="8">OUR JOURNEY</text>
  <!-- Story blocks -->
  <g transform="translate(120,140)">
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6" font-weight="600">2020</text>
    <text x="0" y="35" font-family="Georgia, serif" font-size="22" fill="white" font-weight="700">The Beginning</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="13" fill="#a1a1aa">Started with a vision to transform</text>
    <text x="0" y="78" font-family="Arial, sans-serif" font-size="13" fill="#a1a1aa">digital experiences worldwide.</text>
  </g>
  <g transform="translate(120,280)">
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6" font-weight="600">2022</text>
    <text x="0" y="35" font-family="Georgia, serif" font-size="22" fill="white" font-weight="700">Growth Phase</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="13" fill="#a1a1aa">Expanded to 15 countries serving</text>
    <text x="0" y="78" font-family="Arial, sans-serif" font-size="13" fill="#a1a1aa">over 500 clients globally.</text>
  </g>
  <g transform="translate(120,420)">
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6" font-weight="600">2024</text>
    <text x="0" y="35" font-family="Georgia, serif" font-size="22" fill="white" font-weight="700">Where We Are</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="13" fill="#a1a1aa">Industry leaders in design and</text>
    <text x="0" y="78" font-family="Arial, sans-serif" font-size="13" fill="#a1a1aa">innovation with 50+ team members.</text>
  </g>
  <!-- Stats row -->
  <g transform="translate(0,620)">
    <rect x="80" y="0" width="640" height="80" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="210" y="35" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="28" fill="white" font-weight="700">500+</text>
    <text x="210" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="1">CLIENTS</text>
    <text x="400" y="35" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="28" fill="white" font-weight="700">15</text>
    <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="1">COUNTRIES</text>
    <text x="590" y="35" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="28" fill="white" font-weight="700">98%</text>
    <text x="590" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="1">SATISFACTION</text>
  </g>
  <!-- Bottom branding -->
  <rect x="0" y="740" width="800" height="60" fill="url(#grad18)" opacity="0.1"/>
  <text x="400" y="776" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#71717a" letter-spacing="3">SWIPE FOR MORE OF OUR STORY →</text>
</svg>
