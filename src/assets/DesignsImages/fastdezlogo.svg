<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="logobg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="logogold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="50%" style="stop-color:#E8C76A"/>
      <stop offset="100%" style="stop-color:#E07A5F"/>
    </linearGradient>
    <linearGradient id="logoaccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#E07A5F"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#logobg)"/>
  <!-- African pattern border -->
  <g opacity="0.1">
    <rect x="20" y="20" width="460" height="460" rx="20" fill="none" stroke="#D4A853" stroke-width="2"/>
    <rect x="30" y="30" width="440" height="440" rx="16" fill="none" stroke="#D4A853" stroke-width="1"/>
    <!-- Corner diamonds -->
    <path d="M40,60 L60,40 L80,60 L60,80 Z" fill="#D4A853"/>
    <path d="M420,60 L440,40 L460,60 L440,80 Z" fill="#D4A853"/>
    <path d="M40,440 L60,420 L80,440 L60,460 Z" fill="#D4A853"/>
    <path d="M420,440 L440,420 L460,440 L440,460 Z" fill="#D4A853"/>
  </g>
  <!-- Outer ring -->
  <circle cx="250" cy="230" r="130" fill="none" stroke="url(#logogold)" stroke-width="3" opacity="0.3"/>
  <circle cx="250" cy="230" r="115" fill="none" stroke="url(#logogold)" stroke-width="1.5" opacity="0.15"/>
  <!-- Inner shield shape -->
  <path d="M250,120 L340,170 L340,280 Q340,330 250,360 Q160,330 160,280 L160,170 Z" fill="none" stroke="url(#logogold)" stroke-width="2.5" opacity="0.4"/>
  <path d="M250,135 L330,178 L330,275 Q330,318 250,345 Q170,318 170,275 L170,178 Z" fill="#D4A853" opacity="0.06"/>
  <!-- FD monogram -->
  <text x="210" y="265" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="bold" fill="url(#logogold)" opacity="0.95">F</text>
  <text x="265" y="265" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="bold" fill="url(#logoaccent)" opacity="0.85">D</text>
  <!-- Decorative line under monogram -->
  <line x1="195" y1="285" x2="310" y2="285" stroke="url(#logoaccent)" stroke-width="2" opacity="0.5"/>
  <circle cx="195" cy="285" r="3" fill="#D4A853" opacity="0.6"/>
  <circle cx="310" cy="285" r="3" fill="#E07A5F" opacity="0.6"/>
  <!-- Brand name -->
  <text x="250" y="415" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="url(#logogold)" text-anchor="middle" letter-spacing="8" opacity="0.9">FASTDEZ</text>
  <text x="250" y="445" font-family="Arial, sans-serif" font-size="12" fill="#D4A853" text-anchor="middle" letter-spacing="6" opacity="0.5">DESIGN STUDIO</text>
</svg>
