<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g39a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="g39b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3cac"/>
      <stop offset="33%" stop-color="#784ba0"/>
      <stop offset="66%" stop-color="#2b86c5"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <linearGradient id="g39c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3cac"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <filter id="glow39">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#g39a)"/>
  <!-- Noise texture -->
  <g opacity="0.02"><rect x="0" y="0" width="800" height="800" fill="url(#g39b)"/></g>
  <!-- Glowing orbs -->
  <circle cx="250" cy="250" r="200" fill="#ff3cac" opacity="0.04"/>
  <circle cx="550" cy="500" r="250" fill="#2b86c5" opacity="0.04"/>
  <circle cx="400" cy="350" r="150" fill="#00ffa3" opacity="0.03"/>
  <!-- Abstract 3D cube wireframe -->
  <g transform="translate(400,320)" filter="url(#glow39)">
    <!-- Back face -->
    <polygon points="-60,-100 60,-100 100,-30 -20,-30" fill="none" stroke="#784ba0" stroke-width="1.5" opacity="0.3"/>
    <!-- Left face -->
    <polygon points="-100,-30 -60,-100 -60,0 -100,70" fill="none" stroke="#ff3cac" stroke-width="1.5" opacity="0.5"/>
    <!-- Right face -->
    <polygon points="60,-100 100,-30 100,70 60,0" fill="none" stroke="#2b86c5" stroke-width="1.5" opacity="0.5"/>
    <!-- Top face -->
    <polygon points="-60,-100 60,-100 20,-30 -100,-30" fill="url(#g39b)" opacity="0.08"/>
    <polygon points="-60,-100 60,-100 20,-30 -100,-30" fill="none" stroke="url(#g39c)" stroke-width="2"/>
    <!-- Front face -->
    <polygon points="-100,-30 20,-30 60,70 -100,70" fill="url(#g39b)" opacity="0.05"/>
    <polygon points="-100,-30 20,-30 60,70 -100,70" fill="none" stroke="url(#g39c)" stroke-width="2" opacity="0.7"/>
    <!-- Bottom face -->
    <polygon points="-100,70 60,70 100,0 -60,0" fill="none" stroke="#00ffa3" stroke-width="1.5" opacity="0.3"/>
    <!-- Vertex glow dots -->
    <circle cx="-60" cy="-100" r="4" fill="#ff3cac"/><circle cx="60" cy="-100" r="4" fill="#784ba0"/>
    <circle cx="-100" cy="-30" r="4" fill="#ff3cac"/><circle cx="20" cy="-30" r="4" fill="#2b86c5"/>
    <circle cx="100" cy="-30" r="3" fill="#2b86c5"/><circle cx="-100" cy="70" r="4" fill="#00ffa3"/>
    <circle cx="60" cy="70" r="4" fill="#00ffa3"/><circle cx="100" cy="70" r="3" fill="#2b86c5"/>
    <circle cx="-60" cy="0" r="3" fill="#784ba0"/><circle cx="60" cy="0" r="3" fill="#784ba0"/>
  </g>
  <!-- Brand -->
  <text x="400" y="520" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" fill="url(#g39c)" font-weight="800" letter-spacing="4">PRISM</text>
  <text x="400" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" letter-spacing="8">3D CREATIVE STUDIO</text>
  <!-- Gradient line -->
  <rect x="280" y="570" width="240" height="2" rx="1" fill="url(#g39c)" opacity="0.4"/>
  <!-- Floating particles -->
  <circle cx="180" cy="150" r="2" fill="#ff3cac" opacity="0.6"/><circle cx="620" cy="200" r="1.5" fill="#00ffa3" opacity="0.5"/>
  <circle cx="150" cy="450" r="1.5" fill="#2b86c5" opacity="0.4"/><circle cx="650" cy="400" r="2" fill="#784ba0" opacity="0.5"/>
  <circle cx="300" cy="650" r="1.5" fill="#00ffa3" opacity="0.4"/><circle cx="500" cy="680" r="2" fill="#ff3cac" opacity="0.3"/>
</svg>
