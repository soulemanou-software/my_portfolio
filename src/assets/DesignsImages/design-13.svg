<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="green13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg13)"/>
  <g opacity="0.03">
    <rect x="50" y="50" width="700" height="700" fill="none" stroke="#166534" stroke-width="0.5"/>
    <rect x="70" y="70" width="660" height="660" fill="none" stroke="#166534" stroke-width="0.5"/>
  </g>
  <!-- House/building abstract mark -->
  <g transform="translate(400,300)">
    <!-- Roof / triangle -->
    <path d="M0,-120 L130,20 L100,20 L100,100 L-100,100 L-100,20 L-130,20 Z" fill="url(#green13)"/>
    <!-- Window cutouts -->
    <rect x="-65" y="30" width="45" height="55" rx="3" fill="#fefce8"/>
    <rect x="20" y="30" width="45" height="55" rx="3" fill="#fefce8"/>
    <!-- Door -->
    <rect x="-15" y="55" width="30" height="45" rx="2" fill="#fefce8"/>
    <!-- Key icon inside door -->
    <circle cx="0" cy="72" r="6" fill="none" stroke="#166534" stroke-width="1.5"/>
    <line x1="0" y1="78" x2="0" y2="90" stroke="#166534" stroke-width="1.5"/>
    <line x1="0" y1="86" x2="5" y2="86" stroke="#166534" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="50" y="-70" width="20" height="50" fill="url(#green13)"/>
  </g>
  <!-- Leaf decoration -->
  <g transform="translate(400,300)" opacity="0.15">
    <ellipse cx="-160" cy="60" rx="20" ry="8" fill="#166534" transform="rotate(-30,-160,60)"/>
    <ellipse cx="-150" cy="80" rx="18" ry="7" fill="#166534" transform="rotate(-15,-150,80)"/>
    <ellipse cx="160" cy="60" rx="20" ry="8" fill="#166534" transform="rotate(30,160,60)"/>
    <ellipse cx="150" cy="80" rx="18" ry="7" fill="#166534" transform="rotate(15,150,80)"/>
  </g>
  <!-- Brand -->
  <rect x="280" y="460" width="240" height="1" fill="#166534" opacity="0.2"/>
  <text x="400" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#166534" letter-spacing="8" font-weight="700">VERDANT</text>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4d7c0f" letter-spacing="6">REAL ESTATE GROUP</text>
</svg>
