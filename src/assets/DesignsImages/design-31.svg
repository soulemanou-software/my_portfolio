<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg31" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="gld31" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg31)"/>
  <!-- Elegant dots pattern -->
  <g fill="#fbbf24" opacity="0.04">
    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/>
    <circle cx="320" cy="80" r="3"/><circle cx="480" cy="80" r="3"/><circle cx="560" cy="80" r="3"/>
    <circle cx="640" cy="80" r="3"/><circle cx="720" cy="80" r="3"/>
    <circle cx="80" cy="720" r="3"/><circle cx="160" cy="720" r="3"/><circle cx="240" cy="720" r="3"/>
    <circle cx="320" cy="720" r="3"/><circle cx="480" cy="720" r="3"/><circle cx="560" cy="720" r="3"/>
    <circle cx="640" cy="720" r="3"/><circle cx="720" cy="720" r="3"/>
  </g>
  <!-- Ornamental corners -->
  <g stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.2">
    <path d="M50,50 L50,120 M50,50 L120,50"/>
    <path d="M750,50 L750,120 M750,50 L680,50"/>
    <path d="M50,750 L50,680 M50,750 L120,750"/>
    <path d="M750,750 L750,680 M750,750 L680,750"/>
  </g>
  <!-- Star burst -->
  <g transform="translate(400,230)" fill="#fbbf24" opacity="0.15">
    <polygon points="0,-30 5,-8 30,0 5,8 0,30 -5,8 -30,0 -5,-8"/>
  </g>
  <!-- Content -->
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fbbf24" letter-spacing="8">FOURTH ANNUAL</text>
  <text x="400" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="white" font-weight="300" letter-spacing="4">Starlight</text>
  <text x="400" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="url(#gld31)" letter-spacing="10">GALA</text>
  <rect x="300" y="420" width="200" height="1" fill="#fbbf24" opacity="0.3"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c4b5fd" letter-spacing="4">An Evening of Hope &amp; Giving</text>
  <!-- Info -->
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" letter-spacing="2" font-weight="600">SATURDAY, DECEMBER 20</text>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a5b4fc" letter-spacing="2">7:00 PM • THE RITZ BALLROOM</text>
  <!-- Highlights -->
  <g transform="translate(400,620)">
    <text x="-140" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fbbf24">Live Orchestra</text>
    <circle cx="-40" cy="-4" r="2" fill="#fbbf24" opacity="0.5"/>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fbbf24">Gourmet Dinner</text>
    <circle cx="75" cy="-4" r="2" fill="#fbbf24" opacity="0.5"/>
    <text x="140" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fbbf24">Silent Auction</text>
  </g>
  <text x="400" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#818cf8" letter-spacing="2">ALL PROCEEDS BENEFIT CHILDREN'S EDUCATION</text>
  <!-- CTA -->
  <rect x="260" y="700" width="280" height="48" rx="24" fill="url(#gld31)"/>
  <text x="400" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e1b4b" letter-spacing="4" font-weight="700">RESERVE YOUR TABLE</text>
</svg>
