<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg24)"/>
  <!-- Brand Pattern Elements showcase -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="6">BRAND PATTERN SYSTEM</text>
  <!-- Pattern tile 1: Geometric -->
  <g transform="translate(60,90)">
    <rect width="200" height="200" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <g transform="translate(100,100)">
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
      <circle cx="0" cy="0" r="5" fill="#3b82f6" opacity="0.5"/>
    </g>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#71717a" letter-spacing="2">GEOMETRIC</text>
  </g>
  <!-- Pattern tile 2: Dots -->
  <g transform="translate(300,90)">
    <rect width="200" height="200" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <g opacity="0.4">
      <circle cx="50" cy="50" r="4" fill="#10b981"/><circle cx="80" cy="50" r="4" fill="#10b981"/>
      <circle cx="110" cy="50" r="4" fill="#10b981"/><circle cx="140" cy="50" r="4" fill="#10b981"/>
      <circle cx="65" cy="75" r="4" fill="#10b981"/><circle cx="95" cy="75" r="4" fill="#10b981"/>
      <circle cx="125" cy="75" r="4" fill="#10b981"/>
      <circle cx="50" cy="100" r="4" fill="#10b981"/><circle cx="80" cy="100" r="4" fill="#10b981"/>
      <circle cx="110" cy="100" r="4" fill="#10b981"/><circle cx="140" cy="100" r="4" fill="#10b981"/>
      <circle cx="65" cy="125" r="4" fill="#10b981"/><circle cx="95" cy="125" r="4" fill="#10b981"/>
      <circle cx="125" cy="125" r="4" fill="#10b981"/>
      <circle cx="50" cy="150" r="4" fill="#10b981"/><circle cx="80" cy="150" r="4" fill="#10b981"/>
      <circle cx="110" cy="150" r="4" fill="#10b981"/><circle cx="140" cy="150" r="4" fill="#10b981"/>
    </g>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#71717a" letter-spacing="2">HALFTONE</text>
  </g>
  <!-- Pattern tile 3: Lines -->
  <g transform="translate(540,90)">
    <rect width="200" height="200" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <g stroke="#f59e0b" stroke-width="1" opacity="0.35">
      <line x1="30" y1="40" x2="170" y2="40"/><line x1="30" y1="60" x2="170" y2="60"/>
      <line x1="30" y1="80" x2="170" y2="80"/><line x1="30" y1="100" x2="170" y2="100"/>
      <line x1="30" y1="120" x2="170" y2="120"/><line x1="30" y1="140" x2="170" y2="140"/>
      <line x1="30" y1="160" x2="170" y2="160"/>
    </g>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#71717a" letter-spacing="2">LINEAR</text>
  </g>
  <!-- Pattern tile 4: Waves -->
  <g transform="translate(60,330)">
    <rect width="200" height="200" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <g stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.4">
      <path d="M30,60 Q65,40 100,60 Q135,80 170,60"/>
      <path d="M30,90 Q65,70 100,90 Q135,110 170,90"/>
      <path d="M30,120 Q65,100 100,120 Q135,140 170,120"/>
      <path d="M30,150 Q65,130 100,150 Q135,170 170,150"/>
    </g>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#71717a" letter-spacing="2">WAVE</text>
  </g>
  <!-- Pattern tile 5: Cross -->
  <g transform="translate(300,330)">
    <rect width="200" height="200" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <g stroke="#8b5cf6" stroke-width="1.5" opacity="0.35">
      <path d="M60,50 L60,70 M50,60 L70,60"/><path d="M100,50 L100,70 M90,60 L110,60"/>
      <path d="M140,50 L140,70 M130,60 L150,60"/>
      <path d="M80,90 L80,110 M70,100 L90,100"/><path d="M120,90 L120,110 M110,100 L130,100"/>
      <path d="M60,130 L60,150 M50,140 L70,140"/><path d="M100,130 L100,150 M90,140 L110,140"/>
      <path d="M140,130 L140,150 M130,140 L150,140"/>
    </g>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#71717a" letter-spacing="2">CROSS</text>
  </g>
  <!-- Pattern tile 6: Diamond -->
  <g transform="translate(540,330)">
    <rect width="200" height="200" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <g fill="none" stroke="#ef4444" stroke-width="1" opacity="0.35">
      <polygon points="100,40 140,80 100,120 60,80"/><polygon points="100,55 125,80 100,105 75,80"/>
      <polygon points="60,100 80,120 60,140 40,120"/><polygon points="140,100 160,120 140,140 120,120"/>
    </g>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#71717a" letter-spacing="2">DIAMOND</text>
  </g>
  <!-- Usage examples -->
  <text x="400" y="585" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="white" font-weight="600">Pattern Application</text>
  <rect x="60" y="610" width="320" height="140" rx="12" fill="#0f172a" stroke="#3f3f46" stroke-width="1"/>
  <!-- Business card with pattern -->
  <g opacity="0.08">
    <polygon points="120,640 155,655 155,685 120,700 85,685 85,655" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="180,640 215,655 215,685 180,700 145,685 145,655" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="240,640 275,655 275,685 240,700 205,685 205,655" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="300,640 335,655 335,685 300,700 265,685 265,655" fill="none" stroke="#3b82f6" stroke-width="1"/>
  </g>
  <text x="220" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" letter-spacing="4">VERTEX</text>
  <text x="220" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b" letter-spacing="2">DESIGN STUDIO</text>
  <text x="220" y="738" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#52525b">Stationery</text>
  <rect x="420" y="610" width="320" height="140" rx="12" fill="#3b82f6"/>
  <!-- Tote bag with pattern -->
  <g opacity="0.15">
    <circle cx="500" cy="665" r="8" fill="white"/><circle cx="530" cy="665" r="8" fill="white"/>
    <circle cx="560" cy="665" r="8" fill="white"/><circle cx="590" cy="665" r="8" fill="white"/>
    <circle cx="620" cy="665" r="8" fill="white"/><circle cx="650" cy="665" r="8" fill="white"/>
    <circle cx="515" cy="690" r="8" fill="white"/><circle cx="545" cy="690" r="8" fill="white"/>
    <circle cx="575" cy="690" r="8" fill="white"/><circle cx="605" cy="690" r="8" fill="white"/>
    <circle cx="635" cy="690" r="8" fill="white"/>
  </g>
  <text x="580" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" letter-spacing="4">VERTEX</text>
  <text x="580" y="738" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#52525b">Merchandise</text>
</svg>
