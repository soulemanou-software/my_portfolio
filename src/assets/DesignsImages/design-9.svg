<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg9)"/>
  <!-- Abstract art shapes -->
  <circle cx="550" cy="250" r="180" fill="#f97316" opacity="0.12"/>
  <circle cx="300" cy="400" r="220" fill="#ec4899" opacity="0.08"/>
  <circle cx="500" cy="550" r="150" fill="#8b5cf6" opacity="0.1"/>
  <!-- Brush strokes -->
  <path d="M100,200 Q200,150 350,220 Q500,290 600,200" stroke="#1a1a1a" stroke-width="3" fill="none" opacity="0.1"/>
  <path d="M150,350 Q300,280 450,350 Q600,420 700,350" stroke="#f97316" stroke-width="2" fill="none" opacity="0.15"/>
  <!-- Frame border -->
  <rect x="60" y="60" width="680" height="680" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.1"/>
  <!-- Main content -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a8a7a" letter-spacing="8">THE GALLERY PRESENTS</text>
  <text x="400" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#1a1a1a" font-weight="700" letter-spacing="2">Abstract</text>
  <text x="400" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#f97316" font-weight="300" font-style="italic" letter-spacing="2">Visions</text>
  <rect x="320" y="430" width="160" height="1.5" fill="#1a1a1a" opacity="0.2"/>
  <text x="400" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a1a1a" letter-spacing="3">A Contemporary Art Exhibition</text>
  <!-- Details -->
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#78716c" letter-spacing="3">MARCH 12 — APRIL 28, 2025</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a8a29e" letter-spacing="2">METROPOLITAN ARTS CENTER • NEW YORK</text>
  <!-- Bottom info -->
  <rect x="200" y="650" width="400" height="50" rx="25" fill="#1a1a1a"/>
  <text x="400" y="681" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" letter-spacing="4">FREE ADMISSION — RSVP ONLINE</text>
  <!-- Geometric accents -->
  <polygon points="680,120 710,150 650,150" fill="none" stroke="#f97316" stroke-width="1" opacity="0.3"/>
  <circle cx="130" cy="650" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
