<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="mint30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg30)"/>
  <!-- Product silhouette - abstract smartwatch -->
  <g transform="translate(400,300)">
    <rect x="-70" y="-110" width="140" height="220" rx="30" fill="#18181b" opacity="0.08"/>
    <rect x="-55" y="-85" width="110" height="170" rx="15" fill="none" stroke="#18181b" stroke-width="1.5" opacity="0.12"/>
    <!-- Watch band -->
    <rect x="-35" y="-140" width="70" height="35" rx="4" fill="#18181b" opacity="0.05"/>
    <rect x="-35" y="105" width="70" height="35" rx="4" fill="#18181b" opacity="0.05"/>
    <!-- Screen content hint -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#2dd4bf" opacity="0.3" font-weight="300">12:00</text>
  </g>
  <!-- Top label -->
  <rect x="300" y="60" width="200" height="28" rx="14" fill="url(#mint30)"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" letter-spacing="4" font-weight="600">NEW ARRIVAL</text>
  <!-- Main title -->
  <text x="400" y="510" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="56" fill="#18181b" font-weight="800" letter-spacing="-1">PULSE PRO</text>
  <text x="400" y="555" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2dd4bf" letter-spacing="8" font-weight="300">SERIES 5</text>
  <rect x="310" y="575" width="180" height="1" fill="#18181b" opacity="0.1"/>
  <text x="400" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#71717a" letter-spacing="1">Redefining what a smartwatch can be.</text>
  <!-- Feature pills -->
  <g transform="translate(400,660)">
    <rect x="-195" y="-14" width="120" height="28" rx="14" fill="none" stroke="#d4d4d8" stroke-width="1"/>
    <text x="-135" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="1">72hr Battery</text>
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="none" stroke="#d4d4d8" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="1">5ATM</text>
    <rect x="75" y="-14" width="120" height="28" rx="14" fill="none" stroke="#d4d4d8" stroke-width="1"/>
    <text x="135" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71717a" letter-spacing="1">Health Suite</text>
  </g>
  <!-- CTA -->
  <rect x="280" y="720" width="240" height="48" rx="24" fill="#18181b"/>
  <text x="400" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" letter-spacing="3" font-weight="500">PRE-ORDER $399</text>
</svg>
