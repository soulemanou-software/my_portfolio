<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="orange4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="red4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg4)"/>
  <!-- Subtle diagonal lines -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="800" y2="800" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="800" y2="600" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="600" y2="800" stroke="#1a1a1a" stroke-width="0.5"/>
  </g>
  <!-- Abstract flame / lion mane mark -->
  <g transform="translate(400,310)">
    <!-- Outer flame shapes -->
    <path d="M0,-140 Q60,-120 80,-60 Q100,0 60,60 Q30,100 0,80 Q-30,100 -60,60 Q-100,0 -80,-60 Q-60,-120 0,-140Z" fill="url(#orange4)"/>
    <!-- Inner shape -->
    <path d="M0,-100 Q40,-85 55,-40 Q70,5 40,45 Q20,70 0,55 Q-20,70 -40,45 Q-70,5 -55,-40 Q-40,-85 0,-100Z" fill="url(#red4)"/>
    <!-- White negative space - abstract lion -->
    <circle cx="0" cy="-20" r="35" fill="white"/>
    <circle cx="-14" cy="-28" r="5" fill="#1a1a1a"/>
    <circle cx="14" cy="-28" r="5" fill="#1a1a1a"/>
    <path d="M-8,-12 Q0,-4 8,-12" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,-10 L0,-2" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Brand name -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#1a1a1a" letter-spacing="6" font-weight="700">LIONHEART</text>
  <rect x="280" y="538" width="240" height="1.5" fill="url(#orange4)" opacity="0.6"/>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78716c" letter-spacing="8">FITNESS COLLECTIVE</text>
</svg>
