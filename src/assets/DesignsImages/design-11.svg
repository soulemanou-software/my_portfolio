<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="blk11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg11)"/>
  <!-- Abstract fashion silhouette -->
  <g transform="translate(400,350)" opacity="0.06">
    <ellipse cx="0" cy="-100" rx="40" ry="50" fill="#1a1a1a"/>
    <path d="M-30,-55 Q-80,50 -60,200 L60,200 Q80,50 30,-55" fill="#1a1a1a"/>
  </g>
  <!-- Geometric accents -->
  <line x1="100" y1="100" x2="100" y2="700" stroke="#1a1a1a" stroke-width="0.5" opacity="0.08"/>
  <line x1="700" y1="100" x2="700" y2="700" stroke="#1a1a1a" stroke-width="0.5" opacity="0.08"/>
  <!-- Content -->
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#be185d" letter-spacing="10">HAUTE COUTURE COLLECTION</text>
  <text x="400" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="100" fill="#1a1a1a" font-weight="300" letter-spacing="-2">NOIR</text>
  <text x="400" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="50" fill="#be185d" font-style="italic" letter-spacing="8">&amp; Light</text>
  <rect x="300" y="415" width="200" height="1" fill="#1a1a1a" opacity="0.2"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a1a1a" letter-spacing="3">Spring / Summer 2025</text>
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9f1239" letter-spacing="3">RUNWAY SHOW</text>
  <!-- Details -->
  <g transform="translate(400,570)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="700" letter-spacing="2">OCTOBER 14</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78716c" letter-spacing="2">7:00 PM • THE GRAND PALAIS</text>
  </g>
  <!-- Bottom -->
  <rect x="250" y="660" width="300" height="45" rx="22" fill="url(#blk11)"/>
  <text x="400" y="689" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fdf2f8" letter-spacing="5" font-weight="400">INVITATION ONLY</text>
  <!-- Rose accents -->
  <circle cx="160" cy="300" r="3" fill="#be185d" opacity="0.2"/>
  <circle cx="640" cy="380" r="3" fill="#be185d" opacity="0.2"/>
  <circle cx="180" cy="450" r="2" fill="#be185d" opacity="0.15"/>
