<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coral29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg29)"/>
  <!-- Camera/lens logo mark -->
  <g transform="translate(400,310)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1e293b" stroke-width="3"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.2"/>
    <!-- Aperture blades -->
    <path d="M0,-85 L30,-40 L-30,-40 Z" fill="#1e293b" opacity="0.08"/>
    <path d="M0,-85 L30,-40 L-30,-40 Z" fill="#1e293b" opacity="0.08" transform="rotate(60)"/>
    <path d="M0,-85 L30,-40 L-30,-40 Z" fill="#1e293b" opacity="0.08" transform="rotate(120)"/>
    <path d="M0,-85 L30,-40 L-30,-40 Z" fill="#1e293b" opacity="0.08" transform="rotate(180)"/>
    <path d="M0,-85 L30,-40 L-30,-40 Z" fill="#1e293b" opacity="0.08" transform="rotate(240)"/>
    <path d="M0,-85 L30,-40 L-30,-40 Z" fill="#1e293b" opacity="0.08" transform="rotate(300)"/>
    <!-- Inner lens -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="url(#coral29)"/>
    <!-- Lens flare -->
    <circle cx="10" cy="-10" r="6" fill="white" opacity="0.6"/>
    <circle cx="15" cy="-5" r="3" fill="white" opacity="0.4"/>
  </g>
  <!-- Brand -->
  <text x="400" y="490" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" fill="#1e293b" letter-spacing="10" font-weight="300">LUMIÈRE</text>
  <rect x="300" y="505" width="200" height="2" fill="url(#coral29)" opacity="0.5"/>
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="7">PHOTOGRAPHY STUDIO</text>
</svg>
