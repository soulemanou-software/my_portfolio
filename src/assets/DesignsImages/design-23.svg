<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad23" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg23)"/>
  <!-- Header -->
  <rect x="60" y="50" width="140" height="32" rx="16" fill="url(#grad23)"/>
  <text x="130" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0f172a" letter-spacing="2" font-weight="700">DESIGN TIPS</text>
  <text x="60" y="140" font-family="Georgia, serif" font-size="38" fill="white" font-weight="700">5 Rules for</text>
  <text x="60" y="190" font-family="Georgia, serif" font-size="38" fill="url(#grad23)" font-weight="700">Clean Typography</text>
  <!-- Tips list -->
  <g transform="translate(60,250)">
    <g>
      <circle cx="20" cy="0" r="20" fill="#f97316" opacity="0.15"/>
      <text x="20" y="6" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#f97316" font-weight="700">1</text>
      <text x="55" y="6" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" font-weight="600">Limit to 2 typefaces max</text>
      <text x="55" y="28" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Pair a serif with a sans-serif for contrast.</text>
    </g>
    <g transform="translate(0,80)">
      <circle cx="20" cy="0" r="20" fill="#f97316" opacity="0.15"/>
      <text x="20" y="6" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#f97316" font-weight="700">2</text>
      <text x="55" y="6" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" font-weight="600">Establish clear hierarchy</text>
      <text x="55" y="28" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Use size, weight, and color to guide the eye.</text>
    </g>
    <g transform="translate(0,160)">
      <circle cx="20" cy="0" r="20" fill="#eab308" opacity="0.15"/>
      <text x="20" y="6" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#eab308" font-weight="700">3</text>
      <text x="55" y="6" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" font-weight="600">Mind your line height</text>
      <text x="55" y="28" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">1.5x font size for body text readability.</text>
    </g>
    <g transform="translate(0,240)">
      <circle cx="20" cy="0" r="20" fill="#eab308" opacity="0.15"/>
      <text x="20" y="6" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#eab308" font-weight="700">4</text>
      <text x="55" y="6" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" font-weight="600">Use whitespace generously</text>
      <text x="55" y="28" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Let your text breathe for better composition.</text>
    </g>
    <g transform="translate(0,320)">
      <circle cx="20" cy="0" r="20" fill="#f97316" opacity="0.15"/>
      <text x="20" y="6" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#f97316" font-weight="700">5</text>
      <text x="55" y="6" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" font-weight="600">Align consistently</text>
      <text x="55" y="28" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Left-align body text. Center sparingly.</text>
    </g>
  </g>
  <!-- Bottom -->
  <rect x="0" y="720" width="800" height="80" fill="#0f172a"/>
  <text x="400" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b" letter-spacing="3">SAVE THIS POST  •  SHARE WITH A FRIEND</text>
  <text x="400" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569" letter-spacing="2">@studiocraft</text>
</svg>
