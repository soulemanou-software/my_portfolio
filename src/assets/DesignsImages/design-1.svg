<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="50%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#c45a3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg1)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="200" y1="0" x2="200" y2="800" stroke="#D4A853" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="800" stroke="#D4A853" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#D4A853" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#D4A853" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#D4A853" stroke-width="1"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="#D4A853" stroke-width="1"/>
  </g>
  <!-- Main logo mark - Abstract N letter -->
  <g transform="translate(400,340)">
    <polygon points="-120,-160 -120,160 -60,160 -60,-40 60,160 120,160 120,-160 60,-160 60,40 -60,-160" fill="url(#gold1)"/>
    <rect x="-120" y="-160" width="20" height="320" fill="url(#accent1)" opacity="0.8"/>
  </g>
  <!-- Decorative lines -->
  <line x1="200" y1="560" x2="600" y2="560" stroke="#D4A853" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="575" x2="550" y2="575" stroke="#E07A5F" stroke-width="0.5" opacity="0.3"/>
  <!-- Brand name -->
  <text x="400" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#D4A853" letter-spacing="16" font-weight="400">NEXUS</text>
  <text x="400" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8a8a9a" letter-spacing="8" font-weight="300">DIGITAL STUDIO</text>
  <!-- Corner accents -->
  <path d="M40,40 L40,80 M40,40 L80,40" stroke="#D4A853" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M760,40 L760,80 M760,40 L720,40" stroke="#D4A853" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M40,760 L40,720 M40,760 L80,760" stroke="#D4A853" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M760,760 L760,720 M760,760 L720,760" stroke="#D4A853" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
