<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g47a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="g47b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g47c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#g47a)"/>
  <!-- Dramatic light cone from top -->
  <polygon points="300,0 500,0 580,800 220,800" fill="url(#g47c)"/>
  <!-- Horizontal scan lines -->
  <g stroke="white" stroke-width="0.3" opacity="0.02">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/><line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="550" x2="800" y2="550"/><line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="650" x2="800" y2="650"/><line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
  </g>
  <!-- Abstract golden record / vinyl -->
  <g transform="translate(400,350)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.08"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#fbbf24" stroke-width="0.3" opacity="0.06"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#fbbf24" stroke-width="0.3" opacity="0.06"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f59e0b" stroke-width="0.3" opacity="0.05"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fbbf24" stroke-width="0.3" opacity="0.05"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.08"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f59e0b" stroke-width="0.3" opacity="0.06"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fbbf24" stroke-width="0.3" opacity="0.08"/>
    <circle cx="0" cy="0" r="20" fill="#fbbf24" opacity="0.08"/>
    <circle cx="0" cy="0" r="5" fill="#fbbf24" opacity="0.3"/>
    <!-- Needle arm hint -->
    <line x1="120" y1="-100" x2="30" y2="-10" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>
    <circle cx="30" cy="-10" r="3" fill="#fbbf24" opacity="0.3"/>
  </g>
  <!-- Typography composition -->
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" letter-spacing="10" opacity="0.6">GRAMOPHONE RECORDS PRESENTS</text>
  <!-- Split text effect -->
  <text x="395" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="110" fill="white" font-weight="700" opacity="0.9">GOLD</text>
  <!-- Clipped lower half with gold -->
  <text x="395" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="110" fill="url(#g47b)" font-weight="700" opacity="0.15">GOLD</text>
  <!-- Subtitle -->
  <text x="400" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#fbbf24" font-weight="300" letter-spacing="14" font-style="italic">Sessions</text>
  <!-- Info -->
  <rect x="310" y="580" width="180" height="1" fill="#fbbf24" opacity="0.2"/>
  <text x="400" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fef3c7" letter-spacing="2" font-weight="500">A LIVE ALBUM EXPERIENCE</text>
  <text x="400" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" letter-spacing="2" font-weight="700">JUNE 21, 2025</text>
  <text x="400" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a8a29e" letter-spacing="2">BLUE NOTE JAZZ CLUB • NEW YORK</text>
  <!-- Performer names -->
  <text x="400" y="725" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#fbbf24" letter-spacing="1">Kamasi Washington • Nubya Garcia • Shabaka Hutchings</text>
  <!-- Bottom bar -->
  <rect x="0" y="765" width="800" height="35" fill="url(#g47b)" opacity="0.9"/>
  <text x="400" y="788" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a1a1a" letter-spacing="4" font-weight="700">STREAM LIVE — GOLDSESSIONS.COM</text>
</svg>
