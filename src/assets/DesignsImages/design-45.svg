<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g45a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="g45b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft45"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#g45a)"/>
  <!-- Soft color blobs -->
  <circle cx="200" cy="300" r="250" fill="#d946ef" opacity="0.06" filter="url(#soft45)"/>
  <circle cx="600" cy="500" r="280" fill="#6366f1" opacity="0.05" filter="url(#soft45)"/>
  <circle cx="400" cy="200" r="200" fill="#ec4899" opacity="0.04" filter="url(#soft45)"/>
  <!-- Geometric abstract composition -->
  <g transform="translate(400,320)">
    <!-- Large circle -->
    <circle cx="-80" cy="-40" r="100" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>
    <circle cx="-80" cy="-40" r="100" fill="#a855f7" opacity="0.03"/>
    <!-- Overlapping rectangle -->
    <rect x="-20" y="-100" width="160" height="200" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.2"/>
    <rect x="-20" y="-100" width="160" height="200" rx="8" fill="#6366f1" opacity="0.03"/>
    <!-- Triangle -->
    <polygon points="-40,80 60,-60 160,80" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.2"/>
    <polygon points="-40,80 60,-60 160,80" fill="#ec4899" opacity="0.03"/>
    <!-- Small accent shapes -->
    <circle cx="120" cy="-80" r="15" fill="#d946ef" opacity="0.15"/>
    <rect x="-120" y="40" width="30" height="30" rx="4" fill="#6366f1" opacity="0.12"/>
    <polygon points="-60,-100 -50,-120 -40,-100" fill="#ec4899" opacity="0.2"/>
    <!-- Intersection highlight dots -->
    <circle cx="30" cy="-40" r="4" fill="#a855f7" opacity="0.4"/>
    <circle cx="60" cy="30" r="3" fill="#6366f1" opacity="0.35"/>
    <circle cx="-10" cy="60" r="3" fill="#ec4899" opacity="0.3"/>
  </g>
  <!-- Header -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a855f7" letter-spacing="10">THE DESIGN COLLECTIVE</text>
  <!-- Title - large elegant type -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="60" fill="#1e1b4b" font-weight="300" letter-spacing="2">Creative</text>
  <text x="400" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="60" fill="url(#g45b)" font-weight="700" letter-spacing="2">Convergence</text>
  <rect x="310" y="650" width="180" height="1.5" fill="url(#g45b)" opacity="0.3"/>
  <!-- Info -->
  <text x="400" y="690" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#581c87" letter-spacing="2">Where Art Meets Technology</text>
  <text x="400" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7c3aed" letter-spacing="2">APRIL 5-8, 2025 • TOKYO</text>
  <!-- Ticket pill -->
  <rect x="290" y="745" width="220" height="40" rx="20" fill="url(#g45b)"/>
  <text x="400" y="771" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" letter-spacing="3" font-weight="600">EXPLORE TICKETS</text>
</svg>
