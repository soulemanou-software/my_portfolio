      <circle cx="75" cy="0" r="4" fill="#cbd5e1"/><rect x="70" y="8" width="10" height="3" rx="1.5" fill="#cbd5e1"/>
      <circle cx="110" cy="0" r="4" fill="#cbd5e1"/><rect x="105" y="8" width="10" height="3" rx="1.5" fill="#cbd5e1"/>
      <circle cx="145" cy="0" r="4" fill="#cbd5e1"/><rect x="140" y="8" width="10" height="3" rx="1.5" fill="#cbd5e1"/>
    </g>
