    <circle cx="90" cy="85" r="25" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="90" cy="85" r="20" fill="url(#g54b)" opacity="0.15"/>
    <text x="90" y="91" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#6366f1" font-weight="700">S</text>
