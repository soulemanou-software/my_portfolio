    <rect x="67" y="225" width="46" height="46" rx="6" fill="url(#g54b)" opacity="0.06"/>
    <rect x="119" y="225" width="46" height="46" rx="6" fill="url(#g54b)" opacity="0.1"/>
    <rect x="15" y="277" width="46" height="46" rx="6" fill="url(#g54b)" opacity="0.06"/>
    <rect x="67" y="277" width="46" height="46" rx="6" fill="url(#g54b)" opacity="0.08"/>
    <rect x="119" y="277" width="46" height="46" rx="6" fill="url(#g54b)" opacity="0.05"/>
