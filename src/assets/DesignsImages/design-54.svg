    <!-- Status bar area -->
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">9:41</text>
    <!-- Header -->
    <rect x="15" y="40" width="150" height="50" rx="8" fill="url(#g54b)" opacity="0.1"/>
    <text x="25" y="58" font-family="Arial, sans-serif" font-size="9" fill="#0ea5e9" font-weight="600">Good morning,</text>
    <text x="25" y="73" font-family="Georgia, serif" font-size="13" fill="#0f172a" font-weight="700">Sarah</text>
    <circle cx="145" cy="62" r="14" fill="url(#g54b)" opacity="0.2"/>
    <!-- Cards -->
    <rect x="15" y="100" width="150" height="70" rx="10" fill="url(#g54b)" opacity="0.08"/>
    <rect x="25" y="112" width="60" height="6" rx="3" fill="#0ea5e9" opacity="0.4"/>
    <rect x="25" y="125" width="100" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="25" y="136" width="80" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="25" y="150" width="50" height="14" rx="7" fill="url(#g54b)" opacity="0.3"/>
    <rect x="15" y="180" width="150" height="70" rx="10" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="25" y="192" width="50" height="6" rx="3" fill="#6366f1" opacity="0.4"/>
    <rect x="25" y="205" width="110" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="25" y="216" width="90" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="25" y="230" width="50" height="14" rx="7" fill="#6366f1" opacity="0.2"/>
