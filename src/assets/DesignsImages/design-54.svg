    <rect x="20" y="232" width="105" height="6" rx="3" fill="url(#g54b)" opacity="0.5"/>
    <text x="145" y="225" font-family="Arial, sans-serif" font-size="8" fill="#6366f1" font-weight="600">75%</text>
