<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g54a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="g54b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="sh54"><feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#g54a)"/>
  <!-- App UI/UX Case Study mockup -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6366f1" letter-spacing="8">APP UI/UX CASE STUDY</text>
  <!-- Phone mockup 1 - Home screen -->
  <g transform="translate(120,90)" filter="url(#sh54)">
    <rect width="180" height="360" rx="24" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Notch -->
