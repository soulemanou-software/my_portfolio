  <polygon points="325,286 335,290 325,294" fill="#6366f1" opacity="0.3"/>
  <path d="M515,290 Q527,290 535,290" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="535,286 545,290 535,294" fill="#6366f1" opacity="0.3"/>
