    <text x="15" y="42" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">8px grid • 16pt type scale</text>
  </g>
  <g transform="translate(300,510)">
    <rect width="200" height="60" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="10" fill="#0f172a" font-weight="700">Interactions</text>
    <text x="15" y="42" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Micro-animations • Haptics</text>
  </g>
  <g transform="translate(520,510)">
    <rect width="200" height="60" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="10" fill="#0f172a" font-weight="700">Accessibility</text>
    <text x="15" y="42" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">WCAG AA • Dynamic Type</text>
  </g>
  <!-- Results bar -->
  <rect x="80" y="600" width="640" height="90" rx="16" fill="url(#g54b)" opacity="0.06" stroke="url(#g54b)" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="400" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6366f1" letter-spacing="4" font-weight="600">RESULTS</text>
  <text x="200" y="665" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="24" fill="#0f172a" font-weight="800">+180%</text>
  <text x="200" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">User Engagement</text>
  <text x="400" y="665" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="24" fill="#0f172a" font-weight="800">4.9/5</text>
  <text x="400" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">App Store Rating</text>
  <text x="600" y="665" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="24" fill="#0f172a" font-weight="800">-45%</text>
  <text x="600" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Bounce Rate</text>
  <!-- Label -->
  <text x="400" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="4">MOBILE APP UI/UX DESIGN</text>
