      <text x="25" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">Projects</text>
      <text x="75" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700">1.2k</text>
      <text x="75" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">Following</text>
      <text x="125" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700">847</text>
      <text x="125" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">Followers</text>
