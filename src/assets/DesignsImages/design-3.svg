<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="teal3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="blue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg3)"/>
  <!-- Grid background -->
  <g opacity="0.04">
    <path d="M0,100H800M0,200H800M0,300H800M0,400H800M0,500H800M0,600H800M0,700H800" stroke="#2dd4bf" stroke-width="0.5"/>
    <path d="M100,0V800M200,0V800M300,0V800M400,0V800M500,0V800M600,0V800M700,0V800" stroke="#2dd4bf" stroke-width="0.5"/>
  </g>
  <!-- Abstract hexagonal logo mark -->
  <g transform="translate(400,330)">
    <polygon points="0,-130 113,-65 113,65 0,130 -113,65 -113,-65" fill="none" stroke="url(#teal3)" stroke-width="2.5"/>
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="url(#blue3)" stroke-width="1.5" opacity="0.6"/>
    <!-- Inner circuit paths -->
    <line x1="0" y1="-90" x2="0" y2="-50" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="-50" r="4" fill="#2dd4bf"/>
    <line x1="-78" y1="45" x2="-40" y2="25" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-40" cy="25" r="4" fill="#38bdf8"/>
    <line x1="78" y1="45" x2="40" y2="25" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="40" cy="25" r="4" fill="#2dd4bf"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#2dd4bf"/>
    <!-- Connection lines -->
    <line x1="0" y1="-50" x2="-40" y2="25" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-50" x2="40" y2="25" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="-40" y1="25" x2="40" y2="25" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Glow effect -->
  <circle cx="400" cy="330" r="100" fill="#2dd4bf" opacity="0.03"/>
  <circle cx="400" cy="330" r="180" fill="#2dd4bf" opacity="0.015"/>
  <!-- Divider -->
  <rect x="300" y="510" width="200" height="1" fill="#2dd4bf" opacity="0.3"/>
  <!-- Brand name -->
  <text x="400" y="570" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" fill="#e2e8f0" letter-spacing="10" font-weight="700">HEXANODE</text>
  <text x="400" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="6">BLOCKCHAIN SOLUTIONS</text>
  <!-- Decorative dots -->
  <circle cx="270" cy="510" r="2" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="530" cy="510" r="2" fill="#38bdf8" opacity="0.5"/>
</svg>
