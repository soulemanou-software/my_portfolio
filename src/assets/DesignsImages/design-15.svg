<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg15)"/>
  <!-- Diagonal stripe -->
  <polygon points="0,0 500,0 300,800 0,800" fill="white" opacity="0.05"/>
  <!-- Large percentage -->
  <text x="400" y="300" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="220" fill="white" font-weight="900" opacity="0.15">%</text>
  <!-- Badge -->
  <g transform="translate(400,120)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="white"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" letter-spacing="4" font-weight="800">LIMITED TIME</text>
  </g>
  <!-- Main content -->
  <text x="400" y="340" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="140" fill="white" font-weight="900">50</text>
  <text x="570" y="310" font-family="'Helvetica Neue', sans-serif" font-size="60" fill="white" font-weight="300">%</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="48" fill="white" font-weight="300" letter-spacing="12">OFF</text>
  <!-- Divider -->
  <rect x="250" y="430" width="300" height="2" fill="white" opacity="0.3"/>
  <!-- Sub text -->
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fecaca" letter-spacing="4">EVERYTHING</text>
  <text x="400" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#fca5a5" letter-spacing="2">Black Friday Weekend Sale</text>
  <!-- Date -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" letter-spacing="2" font-weight="600">NOV 24 — NOV 27</text>
  <!-- CTA -->
  <rect x="250" y="640" width="300" height="55" rx="27" fill="white"/>
  <text x="400" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#dc2626" letter-spacing="3" font-weight="800">SHOP THE SALE</text>
  <!-- Code -->
  <text x="400" y="740" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#fecaca" letter-spacing="4">USE CODE: BLACK50</text>
</svg>
