    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">01</text>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#334155" font-weight="600">Quick Setup</text>
    <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">5 min to start</text>
  </g>
  <g transform="translate(320,450)">
    <rect width="160" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="80" cy="35" r="15" fill="#ede9fe"/>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">02</text>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#334155" font-weight="600">Templates</text>
    <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">100+ ready</text>
  </g>
  <g transform="translate(510,450)">
    <rect width="160" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="80" cy="35" r="15" fill="#ede9fe"/>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">03</text>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#334155" font-weight="600">Support</text>
    <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">24/7 available</text>
  </g>
  <!-- Footer -->
  <rect x="130" y="590" width="540" height="1" fill="#e2e8f0"/>
