  <text x="400" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6366f1">Unsubscribe | Privacy Policy</text>
  <!-- Social icons -->
  <g transform="translate(355,670)" fill="#94a3b8">
    <circle cx="0" cy="0" r="10" fill="#f1f5f9"/><text x="0" y="4" text-anchor="middle" font-size="10">f</text>
    <circle cx="30" cy="0" r="10" fill="#f1f5f9"/><text x="30" y="4" text-anchor="middle" font-size="10">t</text>
    <circle cx="60" cy="0" r="10" fill="#f1f5f9"/><text x="60" y="4" text-anchor="middle" font-size="10">in</text>
  </g>
  <!-- Label -->
  <text x="400" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="4">EMAIL TEMPLATE DESIGN</text>
