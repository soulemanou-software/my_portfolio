<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg19)"/>
  <!-- Workspace elements - behind the scenes feel -->
  <!-- Desk surface -->
  <rect x="60" y="400" width="680" height="340" rx="12" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1"/>
  <!-- Monitor -->
  <rect x="250" y="120" width="300" height="200" rx="8" fill="#1e1b4b"/>
  <rect x="260" y="130" width="280" height="170" rx="4" fill="#312e81"/>
  <!-- Code on screen -->
  <rect x="275" y="150" width="80" height="6" rx="3" fill="#a78bfa" opacity="0.6"/>
  <rect x="275" y="165" width="120" height="6" rx="3" fill="#c4b5fd" opacity="0.4"/>
  <rect x="275" y="180" width="60" height="6" rx="3" fill="#8b5cf6" opacity="0.5"/>
  <rect x="295" y="195" width="100" height="6" rx="3" fill="#c4b5fd" opacity="0.3"/>
  <rect x="295" y="210" width="70" height="6" rx="3" fill="#a78bfa" opacity="0.4"/>
  <rect x="275" y="225" width="90" height="6" rx="3" fill="#c4b5fd" opacity="0.35"/>
  <rect x="275" y="240" width="140" height="6" rx="3" fill="#8b5cf6" opacity="0.3"/>
  <rect x="275" y="255" width="50" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
  <!-- Monitor stand -->
  <rect x="370" y="320" width="60" height="40" fill="#1e1b4b"/>
  <rect x="340" y="355" width="120" height="10" rx="5" fill="#1e1b4b"/>
  <!-- Coffee cup -->
  <rect x="120" y="430" width="50" height="55" rx="6" fill="#78350f" opacity="0.15"/>
  <ellipse cx="145" cy="430" rx="25" ry="8" fill="#78350f" opacity="0.1"/>
  <path d="M170,445 Q190,450 190,460 Q190,470 170,475" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.1"/>
  <!-- Notebook -->
  <rect x="560" y="440" width="120" height="160" rx="4" fill="white" stroke="#e9d5ff" stroke-width="1" transform="rotate(5,620,520)"/>
  <rect x="570" y="460" width="60" height="4" rx="2" fill="#c4b5fd" opacity="0.3" transform="rotate(5,600,462)"/>
  <rect x="570" y="475" width="80" height="4" rx="2" fill="#c4b5fd" opacity="0.25" transform="rotate(5,610,477)"/>
  <rect x="570" y="490" width="50" height="4" rx="2" fill="#c4b5fd" opacity="0.2" transform="rotate(5,595,492)"/>
  <!-- Pen -->
  <rect x="540" y="470" width="6" height="100" rx="3" fill="#7c3aed" opacity="0.3" transform="rotate(-15,543,520)"/>
  <!-- Label -->
  <rect x="240" y="60" width="320" height="36" rx="18" fill="#7c3aed"/>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" letter-spacing="4" font-weight="600">BEHIND THE SCENES</text>
  <!-- Caption area -->
  <rect x="100" y="640" width="600" height="100" rx="12" fill="white" stroke="#e9d5ff" stroke-width="1"/>
  <text x="400" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e1b4b" font-weight="600">Where the magic happens ✦</text>
  <text x="400" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a78bfa" letter-spacing="1">Late nights, strong coffee, clean code.</text>
</svg>
