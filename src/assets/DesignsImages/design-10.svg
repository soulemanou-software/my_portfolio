<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg10)"/>
  <!-- Circuit board pattern -->
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.08" fill="none">
    <path d="M100,0 V200 H300 V100"/><path d="M500,0 V150 H700"/><path d="M0,300 H200 V500 H400"/>
    <path d="M600,300 H800"/><path d="M0,600 H150 V700 H350"/><path d="M500,500 V800"/>
    <circle cx="100" cy="200" r="4"/><circle cx="300" cy="100" r="4"/><circle cx="500" cy="150" r="4"/>
    <circle cx="200" cy="500" r="4"/><circle cx="400" cy="500" r="4"/><circle cx="500" cy="500" r="4"/>
  </g>
  <!-- Glowing orb -->
  <circle cx="400" cy="300" r="120" fill="#6366f1" opacity="0.05"/>
  <circle cx="400" cy="300" r="80" fill="#a855f7" opacity="0.06"/>
  <circle cx="400" cy="300" r="40" fill="#ec4899" opacity="0.08"/>
  <!-- Badge -->
  <rect x="300" y="100" width="200" height="30" rx="15" fill="none" stroke="url(#grad10)" stroke-width="1"/>
  <text x="400" y="121" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#a855f7" letter-spacing="4">TECH SUMMIT 2025</text>
  <!-- Main title -->
  <text x="400" y="280" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="80" fill="white" font-weight="800" letter-spacing="3">FUTURE</text>
  <text x="400" y="360" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" fill="url(#grad10)" font-weight="300" letter-spacing="12">FORWARD</text>
  <!-- Divider -->
  <rect x="250" y="390" width="300" height="2" fill="url(#grad10)" opacity="0.4"/>
  <!-- Info -->
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1" letter-spacing="3">THE GLOBAL TECHNOLOGY CONFERENCE</text>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b" letter-spacing="2">SEPTEMBER 20-22, 2025 • SAN FRANCISCO</text>
  <!-- Speaker cards -->
  <g transform="translate(160,520)">
    <rect width="130" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6366f1" letter-spacing="2">KEYNOTE</text>
    <text x="65" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">AI &amp; Design</text>
  </g>
  <g transform="translate(335,520)">
    <rect width="130" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a855f7" letter-spacing="2">WORKSHOP</text>
    <text x="65" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Web3 Stack</text>
  </g>
  <g transform="translate(510,520)">
    <rect width="130" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ec4899" letter-spacing="2">PANEL</text>
    <text x="65" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Cloud Native</text>
  </g>
  <!-- Stats -->
  <g transform="translate(0,620)">
    <text x="200" y="0" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="32" fill="white" font-weight="700">50+</text>
    <text x="200" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="2">SPEAKERS</text>
    <text x="400" y="0" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="32" fill="white" font-weight="700">3K+</text>
    <text x="400" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="2">ATTENDEES</text>
    <text x="600" y="0" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="32" fill="white" font-weight="700">20+</text>
    <text x="600" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="2">WORKSHOPS</text>
  </g>
  <!-- CTA -->
  <rect x="250" y="710" width="300" height="50" rx="25" fill="url(#grad10)"/>
  <text x="400" y="741" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" letter-spacing="4" font-weight="600">REGISTER NOW</text>
</svg>
