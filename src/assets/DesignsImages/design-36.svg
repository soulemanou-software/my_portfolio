<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg36" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg36)"/>
  <!-- Architecture firm logo - abstract building/columns -->
  <g transform="translate(400,290)">
    <!-- Three columns -->
    <rect x="-100" y="-60" width="25" height="180" fill="#1a1a1a"/>
    <rect x="-12" y="-60" width="25" height="180" fill="#1a1a1a"/>
    <rect x="75" y="-60" width="25" height="180" fill="#1a1a1a"/>
    <!-- Pediment/roof -->
    <polygon points="-120,-70 0,-130 120,-70" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="-120" y1="-70" x2="120" y2="-70" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Base -->
    <rect x="-120" y="120" width="240" height="8" fill="#1a1a1a"/>
    <rect x="-130" y="128" width="260" height="4" fill="#1a1a1a" opacity="0.5"/>
    <!-- Golden ratio spiral accent -->
    <path d="M140,0 Q140,-40 110,-60" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.4"/>
    <path d="M-140,0 Q-140,-40 -110,-60" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Brand -->
  <text x="400" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#1a1a1a" letter-spacing="14" font-weight="400">MERIDIAN</text>
  <rect x="280" y="512" width="240" height="1" fill="#1a1a1a" opacity="0.15"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#737373" letter-spacing="8">ARCHITECTURE</text>
</svg>
