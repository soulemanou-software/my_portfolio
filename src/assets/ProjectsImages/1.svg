<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#ffcd00"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Chart lines -->
  <polyline points="50,380 120,350 190,360 260,300 330,280 400,200 470,220 540,150 610,170 680,100 750,120" fill="none" stroke="url(#accent1)" stroke-width="3" opacity="0.6"/>
  <polyline points="50,400 120,390 190,380 260,340 330,350 400,300 470,310 540,260 610,280 680,220 750,240" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.4"/>
  <!-- Bitcoin symbol -->
  <circle cx="400" cy="220" r="70" fill="none" stroke="url(#accent1)" stroke-width="3" opacity="0.3"/>
  <circle cx="400" cy="220" r="55" fill="#f7931a" opacity="0.15"/>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#f7931a" text-anchor="middle" opacity="0.9">₿</text>
  <!-- Cards -->
  <rect x="60" y="60" width="180" height="90" rx="12" fill="url(#card1)" stroke="#4338ca" stroke-width="1" opacity="0.8"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">BTC / USD</text>
  <text x="80" y="118" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f7931a">$42,580</text>
  <text x="80" y="138" font-family="Arial, sans-serif" font-size="12" fill="#4ade80">▲ +3.24%</text>
  <rect x="560" y="60" width="180" height="90" rx="12" fill="url(#card1)" stroke="#4338ca" stroke-width="1" opacity="0.8"/>
  <text x="580" y="90" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">ETH / USD</text>
  <text x="580" y="118" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#818cf8">$2,284</text>
  <text x="580" y="138" font-family="Arial, sans-serif" font-size="12" fill="#4ade80">▲ +1.87%</text>
  <!-- Title -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">Crypto Exchange Tracker</text>
  <text x="400" y="468" font-family="Arial, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle" opacity="0.7">React / Redux • Real-time Data</text>
</svg>
